<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes Sharing Portal - Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container">

    <div class="login-box">

        <h1>College Notes Sharing Portal</h1>
        <h2>Login</h2>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
